name: Format helper

on:
  push:
    branches: [arena/2b8c5dee-xtoolbox]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format and commit
        run: |
          dart format lib/ test/
          if git diff --quiet; then
            echo "Sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "chore: apply dart format"
          git push

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze > analyze.log 2>&1
          status=$?
          cat analyze.log
          if [ $status -ne 0 ]; then
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "::error title=flutter analyze::$line"
              fi
            done < analyze.log
            exit 1
          fi
      - name: Test
        run: |
          set +e
          flutter test > test.log 2>&1
          status=$?
          cat test.log
          if [ $status -ne 0 ]; then
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "::error title=flutter test::$line"
              fi
            done < test.log
            exit 1
          fi
