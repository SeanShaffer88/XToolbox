name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib/ test/
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  build-windows:
    name: Build Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package XTBox.zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath XTBox.zip
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: XTBox.zip
          generate_release_notes: true
