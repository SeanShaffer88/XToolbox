name: Catalog link check

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    name: Check catalog links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the catalog link checker
        id: check
        continue-on-error: true
        run: python3 tool/check_catalog_links.py --output link-report.md

      - name: Open or update the link-rot issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Catalog link check: dead links found"
          existing=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file link-report.md
          else
            gh issue create --title "$title" --body-file link-report.md
          fi

      - name: Close the link-rot issue when healthy again
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Catalog link check: dead links found"
          existing=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The weekly catalog link check is green again — no dead links."
          fi
